[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litelink"
version = "1.0.0"
description = "Bridge your Android phone and laptop"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
    "websockets>=12.0",
    "watchdog>=3.0.0",
]

[project.scripts]
litelink = "litelink.__main__:main"
